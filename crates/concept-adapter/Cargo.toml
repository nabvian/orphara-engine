[package]
name = "concept-adapter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The one genuine integration seam: maps CARETRACE extractor concepts to DSD Global Concept Registry NodeIds, producing the Blind Core's PatientGraph. Deterministic; unresolved concepts are quarantined, never invented."

[dependencies]
core-types = { path = "../core-types" }
caretrace = { path = "../caretrace", default-features = false }

[dev-dependencies]
dsd = { path = "../dsd" }
dsdc = { path = "../dsdc" }
engine = { path = "../engine" }
gnn = { path = "../gnn" }
temporal = { path = "../temporal" }
