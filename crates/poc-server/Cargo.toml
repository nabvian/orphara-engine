[package]
name = "poc-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Local, std-only HTTP UI to test the Red Cell Enzyme POC end to end: paste reports + a doctor's note, see extraction, audit, diagnosis-support and timeline flags in real time."

[[bin]]
name = "poc-server"
path = "src/main.rs"

[dependencies]
core-types = { path = "../core-types" }
caretrace = { path = "../caretrace" }
concept-adapter = { path = "../concept-adapter" }
dsd = { path = "../dsd" }
dsdc = { path = "../dsdc" }
engine = { path = "../engine" }
gnn = { path = "../gnn" }
temporal = { path = "../temporal" }
